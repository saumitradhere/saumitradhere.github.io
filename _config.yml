# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# ============================================================
# Site settings
# ============================================================

title: "Saumitra Dhere"

description: >-
  Saumitra Dhere is an ecological physiologist studying how
  thermal and UV environments shape behaviour, morphology and
  physiology in lizards.

minimal_mistakes_skin: "contrast"
search: true


# ============================================================
# Build settings
# ============================================================

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/

timezone: Asia/Kolkata

include:
  - _pages


# ============================================================
# Plugins
# ============================================================

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache


# ============================================================
# Author
# ============================================================

author:
  name: "Saumitra Dhere"
  avatar: "/assets/images/Field_Photo_Saumitra2.jpg"
  bio: "Ecological physiologist studying how thermal and UV environments shape behaviour, morphology, and energy allocation in lizards."

  links:
    - label: "Google Scholar"
      icon: "ai ai-fw ai-google-scholar-square"
      url: "https://scholar.google.co.in/citations?user=CHeG3gkAAAAJ&hl=en"

    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/saumitr_a/"

    - label: "BEACON Lab"
      icon: "fas fa-fw fa-flask"
      url: "https://sites.google.com/view/batabyal-lab/home"

    - label: "ORCID"
      icon: "ai ai-fw ai-orcid"
      url: "https://orcid.org/0009-0007-0689-9319"


# ============================================================
# Footer
# ============================================================

footer:
  links:
    - label: "Google Scholar"
      icon: "ai ai-fw ai-google-scholar-square"
      url: "https://scholar.google.co.in/citations?user=CHeG3gkAAAAJ&hl=en"

    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/saumitr_a/"

    - label: "ORCID"
      icon: "ai ai-fw ai-orcid"
      url: "https://orcid.org/0009-0007-0689-9319"


# ============================================================
# Defaults
# ============================================================

defaults:

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false


# ============================================================
# Archives
# ============================================================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
